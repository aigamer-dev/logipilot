<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LogiPilot ops desk</title><meta name="description" content="Operations staff review and answer tickets LogiPilot handed to a human.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05060a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/learning.css"><link rel="stylesheet" href="css/ops.css">
</head><body>
<header class="lp-head"><a href="index.html" class="brand">Logi<span>Pilot</span></a><a class="btn sm" href="chat.html">Back to chat</a></header>
<main class="lp-main" id="main">
<h1>Ops desk</h1>
<p class="lead">Tickets LogiPilot handed to a human. Customer details are masked. Your reply reaches the customer the next time they ask for the ticket's status in their chat.</p>
<form id="auth" class="ops-bar">
  <label for="token">Admin token</label>
  <input id="token" type="password" autocomplete="off" required>
  <label for="status">Show</label>
  <select id="status"><option value="open">Open</option><option value="answered">Answered</option><option value="closed">Closed</option><option value="all">All</option></select>
  <button class="btn primary" type="submit">Load tickets</button>
</form>
<p id="msg" class="muted" role="status" aria-live="polite"></p>
<div id="list"></div>
</main>
<script src="js/config.js"></script><script src="js/ops.js"></script>
</body></html>
