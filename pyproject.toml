[project]
name = "logipilot"
version = "0.1.0"
description = "Multi-agent, multimodal logistics issue handler on Google ADK with Jev typed decisions and Firestore."
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.12.0",
    "google-genai>=2.31",
    "litellm>=1.50",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "google-cloud-firestore>=2.16",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=1.0,<2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["ruff>=0.6", "black>=24.0", "isort>=5.13", "pytest>=8.0", "pillow>=10.0", "fpdf2>=2.7"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
# B008: FastAPI declares params via call defaults. SIM105: explicit try/except reads clearer here.
ignore = ["B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is kept verbatim; wrapping it would change what the model reads.
"logipilot/agents/specialists.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
