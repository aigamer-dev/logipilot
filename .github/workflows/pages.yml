# Publishes the landing and chat pages (web/static) to GitHub Pages.
# Set the repository variable API_BASE to the hosted API URL (e.g. https://logipilot.onrender.com).
name: pages
on:
  push:
    branches: [master]
    paths: ["web/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the chat page at the hosted API
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: printf 'window.LOGIPILOT_API = "%s";\n' "${API_BASE%/}" > web/static/js/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/static
      - id: deployment
        uses: actions/deploy-pages@v4
